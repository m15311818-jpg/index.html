<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الصيدلية الصوتية السريعة</title>
    <!-- مكتبة القراءة الفورية الفائقة السرعة -->
    <script src="https://jsdelivr.net"></script>
    <!-- مكتبة الاكسيل -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #008080; --bg: #f4f7f6; }
        body { font-family: sans-serif; background-color: var(--bg); margin: 0; padding: 15px; text-align: center; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); font-size: 1.4rem; margin-bottom: 15px; }
        
        /* حاوية الكاميرا الهيدروليكية الفورية */
        #video-container { width: 100%; max-width: 350px; margin: 15px auto; position: relative; border-radius: 10px; overflow: hidden; background: #000; display: none; border: 3px solid var(--primary); }
        video { width: 100%; height: auto; display: block; }
        canvas { display: none; }

        /* مستطيل التركيز العرضي الخاص بالأدوية */
        .scanner-laser-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;  
            height: 140px; 
            border: 3px solid #00ffcc;
            box-shadow: 0 0 0 400px rgba(0, 0, 0, 0.5); 
            border-radius: 8px;
            pointer-events: none; 
        }
        /* خط الليزر المسرع رادارياً */
        .scanner-laser-box::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 3px;
            background-color: #ff0055;
            top: 0;
            left: 0;
            animation: radar-laser 1.2s linear infinite; /* تسريع حركة الليزر التوجيهي */
            box-shadow: 0 0 10px #ff0055;
        }
        @keyframes radar-laser {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        button { background: var(--primary); color: white; border: none; padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 10px 5px; }
        .btn-excel { background-color: #1f7246; }
        .status { font-weight: bold; margin: 12px 0; color: #333; font-size: 1rem; min-height: 24px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
        th { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 منظومة الكاشير الصوتي للصيدلية (فائق السرعة)</h1>
    
    <button id="btn-toggle-camera">📸 فتح الكاميرا التلقائية</button>
    <button id="btn-download" class="btn-excel">📥 تحميل ملف Excel</button>
    
    <div class="status" id="status-text">اضغط على زر فتح الكاميرا للبدء بالفحص اللحظي المطور</div>

    <div id="video-container">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="scanner-laser-box"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>الوقت</th>
                <th>اسم الدواء المسجل</th>
                <th>السعر</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script src="app.js"></script>
</body>
</html>
