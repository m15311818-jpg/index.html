<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الصيدلية - مسح QR سريع</title>
    <!-- استخدام مكتبة jsQR الخفيفة جداً والسريعة في التحميل -->
    <script src="https://jsdelivr.net"></script>
    <!-- مكتبة الاكسيل الخفيفة -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #008080; --bg: #f4f7f6; }
        body { font-family: sans-serif; background-color: var(--bg); margin: 0; padding: 15px; text-align: center; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 20px; }
        #video-container { width: 100%; max-width: 400px; margin: 0 auto; position: relative; border-radius: 8px; overflow: hidden; background: #000; display: none; }
        video { width: 100%; height: auto; display: block; }
        canvas { display: none; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 10px 5px; }
        .btn-excel { background-color: #1f7246; }
        .status { font-weight: bold; margin: 15px 0; color: #555; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
        th { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 مسح المبيعات السريع بالـ QR</h1>
    
    <!-- أزرار التحكم الأساسية تظهر فوراً دون انتظار -->
    <button id="btn-toggle-camera">📸 تشغيل الكاميرا الخلفية</button>
    <button id="btn-download" class="btn-excel">📥 تحميل ملف Excel</button>
    
    <div class="status" id="status-text">اضغط على زر تشغيل الكاميرا للبدء</div>

    <!-- حاوية الكاميرا الهجينة السريعة -->
    <div id="video-container">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- جدول المبيعات -->
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>الوقت</th>
                <th>بيانات الـ QR</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script src="app.js"></script>
</body>
</html>
