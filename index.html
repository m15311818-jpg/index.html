<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الصيدلية الفورية</title>
    <!-- تم إزالة مكتبات القراءة الخارجية لضمان التحميل اللحظي للموقع -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #008080; --bg: #f4f7f6; }
        body { font-family: sans-serif; background-color: var(--bg); margin: 0; padding: 15px; text-align: center; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); font-size: 1.4rem; margin-bottom: 20px; }
        
        /* تصميم زر الكاميرا الأصلي الذكي */
        .scan-btn-wrapper { position: relative; display: inline-block; margin: 10px; }
        .scan-btn { background: var(--primary); color: white; border: none; padding: 15px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; display: inline-block; }
        .scan-btn-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .btn-excel { background-color: #1f7246; color: white; border: none; padding: 15px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 10px; }
        .status { font-weight: bold; margin: 15px 0; color: #333; font-size: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 0.95rem; }
        th { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 المسح الفوري لمبيعات الصيدلية</h1>
    
    <!-- زر ذكي يفتح كاميرا الهاتف الأصلية السريعة والذكية فوراً -->
    <div class="scan-btn-wrapper">
        <button class="scan-btn">📸 صور الـ QR على العلبة</button>
        <input type="file" accept="image/*" capture="environment" id="qr-camera-input">
    </div>
    
    <button id="btn-download" class="btn-excel">📥 تحميل ملف Excel</button>
    
    <div class="status" id="status-text">اضغط على زر الكاميرا لتصوير علبة الدواء وسيتم حفظها فوراً</div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>الوقت</th>
                <th>بيانات الـ QR المسجلة</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script src="app.js"></script>
</body>
</html>
